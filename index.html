<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5c7a">
  <meta name="description" content="MedTrack Pro — Advanced medicine reminder and adherence tracker">
  <title>MedTrack Pro — Advanced Medicine Reminder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated background orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <!-- Header -->
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </div>
    <div class="brand">
      <b>MedTrack</b>
      <span>Advanced medicine tracking</span>
    </div>
    <button class="header-action" data-act="add" aria-label="Add medicine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </header>

  <!-- Main content -->
  <main id="app"></main>

  <!-- Bottom navigation -->
  <nav aria-label="Main navigation"></nav>

  <!-- Overlays -->
  <div id="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
